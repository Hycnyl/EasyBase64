name: Refresh release descriptions (one time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-release-descriptions.yml

permissions:
  contents: write

jobs:
  update-descriptions:
    if: github.repository == 'Hycnyl/EasyBase64'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_EDITS: >-
        [{"id":418479956,"tag":"v1.1.0-public","old_body":"# EasyBase64 1.1.0\r\n\r\n## 更新内容\r\n\r\n- 界面优化：调整操作布局，将格式参数移至输出目录之前。\r\n- 文案改进：完善中英文提示，明确 Base64 填充、空白字符及 Windows \"certutil\" 兼容格式的说明。\r\n- 设置升级：新增开发者与 GitHub 项目快捷链接，明确官方发布渠道。\r\n\r\n## 重要提醒\r\n\r\n应用包名变更为 \"com.hycnyl.easybase64\"，无法直接覆盖安装 v1.0.0。新旧版本可同时安装，但原有设置、任务记录及文件访问授权不会自动迁移。","new_body":"## 简体中文\n\n- 包名改为 `com.hycnyl.easybase64`。与 1.0.x 独立安装，可共存；设置、任务记录和文件授权不会自动迁移。\n- 将“格式参数”移至“输出目录”之前。\n- 开发者信息统一为 Hycnyl；“设置与关于”改为“设置”，增加开发者主页及 GitHub 项目的蓝色链接与图标。\n- 同步完善中英文编码与解码文案，包括 Windows `certutil` 包装说明、“保留末尾填充（=）”“允许 ASCII 空白”“接受 CERTIFICATE 包装”和“接受 省略填充（=）”。\n- 精简设置页底部说明。\n\n## English\n\n- Change the application ID to `com.hycnyl.easybase64`. It installs alongside 1.0.x as a separate app; settings, task history and file permissions do not migrate automatically.\n- Move Format options before Output folder.\n- Set developer attribution to Hycnyl, rename “Settings & about” to “Settings,” and add blue developer/project links with icons.\n- Refine both languages' encoding and decoding text, including Windows `certutil` wrapping, “Keep trailing padding (=),” “Allow ASCII whitespace,” “Accept CERTIFICATE wrapper” and “Accept omitted padding (=).”\n- Shorten the notice at the bottom of Settings.\n\n## 致谢 / Credits\n\n使用 / Built with AndroidX (Compose, Material 3, Adaptive, Room), Kotlin and kotlinx.coroutines (Apache-2.0). [第三方声明 / Third-party notices](https://github.com/Hycnyl/EasyBase64/blob/main/docs/THIRD_PARTY_NOTICES.md) · [MIT License](https://github.com/Hycnyl/EasyBase64/blob/main/LICENSE).\n"},{"id":418044835,"tag":"v1.0.0-public","old_body":"# 1.0.0\r\n第一个可用的发行版！","new_body":"## 简体中文\n\n首个公开版本，支持 Android 12 及以上。\n\n- 多选文件或扫描文件夹进行 Base64 编解码，可递归处理子目录并保留相对路径。\n- 支持 Standard / URL-safe、填充、折行、换行格式和 CERTIFICATE 包装；解码时校验完整输入。\n- 每批新建输出目录，自动处理重名；显示逐文件状态、进度与错误，支持取消和重试。\n- 提供简体中文 / English、动态配色、浅色 / 深色主题和自适应布局。\n- 本地流式处理，无账号、广告、遥测或应用联网。\n\n## English\n\nFirst public release, for Android 12 and later.\n\n- Batch Base64 conversion for selected files or folders, with optional recursive scanning and preserved relative paths.\n- Standard / URL-safe alphabets, padding, line wrapping/endings and CERTIFICATE wrapping, with full-input decoding validation.\n- A separate output folder per batch, automatic duplicate-name handling, per-file status, progress and errors, cancellation and retries.\n- English / Simplified Chinese, dynamic colors, light / dark themes and adaptive layouts.\n- Local streaming processing, with no account, ads, telemetry or app networking.\n\n## 致谢 / Credits\n\n使用 / Built with AndroidX (Compose, Material 3, Adaptive, Room), Kotlin and kotlinx.coroutines (Apache-2.0). [第三方声明 / Third-party notices](https://github.com/Hycnyl/EasyBase64/blob/main/docs/THIRD_PARTY_NOTICES.md) · [MIT License](https://github.com/Hycnyl/EasyBase64/blob/main/LICENSE).\n"}]
    steps:
      - name: Update only the two existing release bodies
        shell: python
        run: |
          import json
          import os
          import urllib.request

          api = "https://api.github.com/repos/Hycnyl/EasyBase64"
          edits = json.loads(os.environ["RELEASE_EDITS"])
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "EasyBase64-documentation-refresh",
          }

          def request(path, body=None):
              payload = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  api + path, data=payload, headers=headers,
                  method="GET" if body is None else "PATCH",
              )
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def identity(release):
              fields = ("id", "tag_name", "name", "target_commitish", "draft",
                        "prerelease", "immutable", "created_at", "published_at")
              return {key: release.get(key) for key in fields}

          def assets(release):
              return sorted(
                  (a["id"], a["name"], a["size"], a.get("digest"))
                  for a in release["assets"]
              )

          before = {}
          for edit in edits:
              path = "/releases/" + str(edit["id"])
              release = request(path)
              if release["tag_name"] != edit["tag"]:
                  raise RuntimeError("Release tag changed: " + edit["tag"])
              if release.get("body", "") not in (edit["old_body"], edit["new_body"]):
                  raise RuntimeError("Release was edited concurrently: " + edit["tag"])
              before[edit["id"]] = release

          for edit in edits:
              original = before[edit["id"]]
              if original.get("body", "") == edit["new_body"]:
                  print("Already current: " + edit["tag"])
                  continue
              updated = request("/releases/" + str(edit["id"]), {"body": edit["new_body"]})
              if updated.get("body") != edit["new_body"]:
                  raise RuntimeError("Body verification failed: " + edit["tag"])
              if identity(updated) != identity(original) or assets(updated) != assets(original):
                  raise RuntimeError("Release metadata/assets unexpectedly changed: " + edit["tag"])
              print("Updated description: " + edit["tag"])
